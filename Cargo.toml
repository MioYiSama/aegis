[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
wasm-bindgen = "0.2.128"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.aegis-wasm-release]
inherits = "release"
lto = "fat"
opt-level = "z"
