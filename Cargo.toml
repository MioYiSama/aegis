[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toasty = { version = "0.10.0", features = ["sqlite", "migration", "serde"] }
toasty-cli = "0.10.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
uuid = { version = "1.26.1", features = ["v7"] }
wasm-bindgen = "0.2.128"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.aegis-wasm-release]
inherits = "release"
lto = "fat"
opt-level = "z"
